name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Materialize env
        run: |
          cp .env.example .env
          sed -i "s/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .env
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm test
      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

  # Scaffold each variant with the real CLI and put it through the same
  # gauntlet — overlays must never drift from the template.
  variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-ui
            flags: --ui=base
            integration: false
          - name: rebac
            flags: --authz=rebac --locale=fr
            integration: true
          - name: base-ui-rebac
            flags: --ui=base --authz=rebac
            integration: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold ${{ matrix.name }}
        run: node_modules/.bin/tsx src/index.ts "$RUNNER_TEMP/variant-app" --yes ${{ matrix.flags }} --no-git --no-install
      - run: pnpm install
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm lint
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm build
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm check-types
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm test
        working-directory: ${{ runner.temp }}/variant-app
      - name: Integration tests (Testcontainers)
        if: matrix.integration
        run: pnpm test:integration
        working-directory: ${{ runner.temp }}/variant-app

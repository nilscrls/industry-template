name: CI

# Release-only: the full gauntlet (template + per-variant scaffolds with
# Testcontainers) is too heavy for every push/PR, so it gates releases
# instead — git-flow release branches, version tags, or a manual run.
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Materialize env
        run: |
          cp .env.example .env
          sed -i "s/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .env
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm test
      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

  # Scaffold each variant with the real CLI and put it through the same
  # gauntlet — overlays must never drift from the template.
  variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-ui
            flags: --ui=base
            integration: false
          - name: rebac
            flags: --authz=rebac --locale=fr
            integration: true
          - name: base-ui-rebac
            flags: --ui=base --authz=rebac
            integration: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold ${{ matrix.name }}
        run: node_modules/.bin/tsx src/index.ts "$RUNNER_TEMP/variant-app" --yes ${{ matrix.flags }} --no-git --no-install
      # Every row scaffolds with the default --ai=claude; the CLI test suite
      # covers --ai=none absence.
      - name: Verify AI config
        working-directory: ${{ runner.temp }}/variant-app
        run: |
          test -f CLAUDE.md && test -f AGENTS.md && test -d .claude/rules
          ! grep -q "__UI_VARIANT__" AGENTS.md
      # Not frozen: variant overlays legitimately change package.json (e.g.
      # ui-base swaps Radix for Base UI), so the scaffold's first install
      # must be allowed to update the copied lockfile — exactly what a user's
      # local `pnpm install` does.
      - run: pnpm install --no-frozen-lockfile
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm lint
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm build
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm check-types
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm test
        working-directory: ${{ runner.temp }}/variant-app
      - name: Integration tests (Testcontainers)
        if: matrix.integration
        run: pnpm test:integration
        working-directory: ${{ runner.temp }}/variant-app

  # Drive the reference template through Playwright against a live stack, so
  # the shipped e2e specs are validated on release (generated apps run the
  # same suite via the template's own workflow).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Materialize env
        # Export into the job env so the built apps (which don't load .env
        # themselves) and Playwright (WEB_URL) both see the values.
        run: |
          cp .env.example .env
          sed -i "s/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .env
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env >> "$GITHUB_ENV"
      - name: Start infrastructure
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up -d --wait
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - name: Start apps
        run: |
          (cd apps/api && nohup node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup pnpm start > /tmp/web.log 2>&1 &)
          npx wait-on --timeout 90000 http://localhost:3001/health/ready http://localhost:3000
      - name: Install Playwright browser
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm --filter @repo/web exec playwright test --project=chromium
      - name: Logs on failure
        if: failure()
        run: |
          echo "── api ──"; cat /tmp/api.log || true
          echo "── web ──"; cat /tmp/web.log || true

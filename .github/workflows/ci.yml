name: CI

# Release-only: the full gauntlet (template + per-variant scaffolds with
# Testcontainers) is too heavy for every push/PR, so it gates releases
# instead — git-flow release branches, version tags, or a manual run.
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Materialize env
        run: |
          cp .env.example .env
          sed -i "s/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .env
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm test
      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

  # Scaffold each variant with the real CLI and put it through the same
  # gauntlet — overlays must never drift from the template.
  variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-ui
            flags: --ui=base
            integration: false
          - name: rebac
            flags: --authz=rebac --locale=fr
            integration: true
          - name: base-ui-rebac
            # Also exercises --no-backup: install/lint/build/test must pass
            # with the backup tooling pruned (nothing may reference it).
            flags: --ui=base --authz=rebac --no-backup
            integration: false
          - name: gitlab-winston
            # Only row that boots createApp() on the winston stack.
            flags: --ci=gitlab --logging=winston
            integration: true
          - name: single-org-url-i18n
            flags: --org=single --i18n=url
            integration: false
          - name: api-direct
            # Direct-to-API mode: the anchored edits (no Next rewrite,
            # API_PUBLIC_URL/COOKIE_DOMAIN env, Better-Auth on the API
            # origin) must survive lint/build/check-types/test.
            flags: --api=direct
            integration: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold ${{ matrix.name }}
        run: node_modules/.bin/tsx src/index.ts "$RUNNER_TEMP/variant-app" --yes ${{ matrix.flags }} --no-git --no-install
      # Every row scaffolds with the default --ai=claude; the CLI test suite
      # covers --ai=none absence.
      - name: Verify AI config
        working-directory: ${{ runner.temp }}/variant-app
        run: |
          test -f CLAUDE.md && test -f AGENTS.md && test -d .claude/rules
          ! grep -q "__UI_VARIANT__" AGENTS.md
      # GitLab overlay replaces .github + release-please with .gitlab-ci.yml.
      - name: Verify GitLab CI overlay
        if: contains(matrix.flags, '--ci=gitlab')
        working-directory: ${{ runner.temp }}/variant-app
        run: |
          test -f .gitlab-ci.yml && test ! -d .github
          ! grep -q "__PROD_BRANCH__" .gitlab-ci.yml
      # Not frozen: variant overlays legitimately change package.json (e.g.
      # ui-base swaps Radix for Base UI), so the scaffold's first install
      # must be allowed to update the copied lockfile — exactly what a user's
      # local `pnpm install` does.
      - run: pnpm install --no-frozen-lockfile
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm lint
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm build
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm check-types
        working-directory: ${{ runner.temp }}/variant-app
      - run: pnpm test
        working-directory: ${{ runner.temp }}/variant-app
      - name: Integration tests (Testcontainers)
        if: matrix.integration
        run: pnpm test:integration
        working-directory: ${{ runner.temp }}/variant-app

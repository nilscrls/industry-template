# Base definitions only — no host ports here.
#   dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up -d
#   all:  docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile all up -d --build
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile all up -d --build
name: industry-app

services:
  postgres:
    image: postgres:17-alpine
    profiles: [dev, all]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?declare POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?declare POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?declare POSTGRES_DB in .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?declare APP_USER_PASSWORD in .env}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?declare APP_AUTH_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # RLS principals (app_user / app_auth), created on first boot only.
      - ./packages/db/sql/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [dev, all]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [dev, all]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?declare S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?declare S3_SECRET_KEY in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: [dev, all]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:?declare S3_ACCESS_KEY in .env} ${S3_SECRET_KEY:?declare S3_SECRET_KEY in .env} &&
      mc mb --ignore-existing local/${S3_BUCKET:?declare S3_BUCKET in .env}
      "
    restart: "no"

  # OpenFGA — the authorization engine. Its datastore is a dedicated
  # `openfga` database on the shared postgres (created by init-roles.sh).
  openfga-migrate:
    image: openfga/openfga:v1
    profiles: [dev, all]
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1
    profiles: [dev, all]
    restart: unless-stopped
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${FGA_API_TOKEN:?declare FGA_API_TOKEN in .env}
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev:latest
    profiles: [dev]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:1080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional local OTLP sink: add `--profile otel` and set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (in docker: http://otel-collector:4318).
  # Point the exporter at your real collector in production instead.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [otel]
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [all]
    command: ["node", "node_modules/@repo/db/dist/migrate.js"]
    environment:
      # Owner connection: migrations manage tables and RLS policies.
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [all]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      # Restricted runtime role (RLS) + the auth-only BYPASSRLS role.
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      DATABASE_URL_AUTH: postgresql://app_auth:${APP_AUTH_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379
      FGA_API_URL: http://openfga:8080
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      openfga:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?declare NEXT_PUBLIC_API_URL in .env}
        # Baked into the standalone rewrite at build time; in prod the reverse
        # proxy routes /api before it reaches this container anyway.
        API_URL: http://api:3001
        NEXT_PUBLIC_SENTRY_ENABLED: ${NEXT_PUBLIC_SENTRY_ENABLED:?declare NEXT_PUBLIC_SENTRY_ENABLED in .env}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:?declare NEXT_PUBLIC_SENTRY_DSN in .env}
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:?declare NEXT_PUBLIC_POSTHOG_ENABLED in .env}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:?declare NEXT_PUBLIC_POSTHOG_KEY in .env}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:?declare NEXT_PUBLIC_POSTHOG_HOST in .env}
    profiles: [all]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── BEGIN backup ──────────────────────────────────────────────────────────
  # One-shot backup/restore jobs (`pnpm backup:db` etc. run them through
  # `docker compose --profile backup run`). They join the stack network, so
  # they work with both the dev and prod overlays — no published ports needed.
  # Removed entirely when scaffolded with --backup=false.
  backup-db:
    image: postgres:17-alpine # same major as the server ⇒ matching pg_dump
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?declare POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?declare POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?declare POSTGRES_DB in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?declare BACKUP_RETENTION_DAYS in .env}
    volumes:
      - ${BACKUP_DIR:?declare BACKUP_DIR in .env}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /backups/db
        file="/backups/db/$$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"
        pg_dump --format=custom --file="$$file"
        echo "wrote $$file"
        find /backups/db -name '*.dump' -mtime "+$$BACKUP_RETENTION_DAYS" -delete
    restart: "no"

  restore-db:
    image: postgres:17-alpine
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?declare POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?declare POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?declare POSTGRES_DB in .env}
      # Job parameter set per-invocation by scripts/backup/restore-db.mjs —
      # deliberately not in .env (the empty interpolation default is safe:
      # the script below fails fast when it is missing).
      RESTORE_FILE: ${RESTORE_FILE:-}
    volumes:
      - ${BACKUP_DIR:?declare BACKUP_DIR in .env}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$$RESTORE_FILE" ]; then
          echo "RESTORE_FILE not set — run pnpm restore:db <dump-file>" >&2
          exit 1
        fi
        pg_restore --clean --if-exists --no-owner \
          --dbname="$$PGDATABASE" "/backups/db/$$RESTORE_FILE"
    restart: "no"

  backup-files:
    image: minio/mc:latest
    profiles: [backup]
    environment:
      # Point at your real S3 endpoint if you moved off the bundled minio.
      BACKUP_S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?declare S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?declare S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?declare S3_BUCKET in .env}
    volumes:
      - ${BACKUP_DIR:?declare BACKUP_DIR in .env}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set backup-src "$$BACKUP_S3_ENDPOINT" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mirror --overwrite --remove "backup-src/$$S3_BUCKET" "/backups/files/$$S3_BUCKET"
        echo "mirrored bucket $$S3_BUCKET to /backups/files/$$S3_BUCKET"
    restart: "no"

  restore-files:
    image: minio/mc:latest
    profiles: [backup]
    environment:
      BACKUP_S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?declare S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?declare S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?declare S3_BUCKET in .env}
    volumes:
      - ${BACKUP_DIR:?declare BACKUP_DIR in .env}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set backup-src "$$BACKUP_S3_ENDPOINT" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mirror --overwrite "/backups/files/$$S3_BUCKET" "backup-src/$$S3_BUCKET"
        echo "restored /backups/files/$$S3_BUCKET into bucket $$S3_BUCKET"
    restart: "no"
  # ─── END backup ────────────────────────────────────────────────────────────

volumes:
  postgres-data:
  redis-data:
  minio-data:

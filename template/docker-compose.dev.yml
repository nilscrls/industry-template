# Dev overlay — exposes service ports on the docker host.
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console

  openfga:
    ports:
      - "8080:8080" # HTTP API (playground stays disabled: 3000 belongs to web)

  maildev:
    ports:
      - "1080:1080" # web UI
      - "1025:1025" # SMTP

  otel-collector:
    ports:
      - "4318:4318" # OTLP http
      - "4317:4317" # OTLP grpc

  api:
    ports:
      - "3001:3001"

  web:
    ports:
      - "3000:3000"
